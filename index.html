<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara World Tracker</title>
    <style>
        :root {
            --primary: #5c8374;
            --secondary: #1b4242;
            --light: #f5f7f8;
            --dark: #092626;
            --accent: #9ec8b9;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background: linear-gradient(rgba(9, 38, 38, 0.8), rgba(9, 38, 38, 0.8)), url('https://unsplash.com') center/cover;
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Controls Section */
        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            text-transform: uppercase;
        }
        select, input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 180px;
        }

        /* Zoo Cards Grid: Absolute 4-column split */
        .zoo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .zoo-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
        }
        .zoo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }
        .zoo-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .zoo-name {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 0.25rem;
            font-weight: bold;
        }
        .zoo-location {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }
        .zoo-teaser-metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #555;
            padding-top: 0.5rem;
            border-top: 1px solid #eee;
        }
        
        /* Expandable Details */
        .zoo-details {
            display: none;
            background: #fafafa;
            padding: 0.75rem;
            border-radius: 6px;
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: #444;
            line-height: 1.4;
        }
        .zoo-details strong { color: var(--secondary); }
        
        .capy-photo {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin: 0.5rem 0;
            border: 1px solid #ddd;
        }

        .transport-box {
            background: white;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            margin-top: 0.5rem;
        }

        /* Responsive scaling */
        @media (max-width: 1024px) { .zoo-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .zoo-grid { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 480px) { .zoo-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>Global Capybara Tracker</h1>
        <p>Analyze transit corridors and admission grids without map rendering.</p>
    </header>

    <div class="container">
        <!-- Filtering and Sorting Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="sort-select">Sort Zoos By</label>
                <select id="sort-select" onchange="processDisplay()">
                    <option value="default">Default List</option>
                    <option value="cheapest">Cheapest Ticket First</option>
                </select>
            </div>
            <div class="control-group">
                <label for="price-filter">Max Ticket Price (USD)</label>
                <input type="number" id="price-filter" placeholder="e.g. 30" oninput="processDisplay()">
            </div>
            <div style="flex-grow: 1; text-align: right; font-size: 0.9rem; color: #666;">
                <span id="zoo-count"></span> locations discovered.
            </div>
        </div>

        <!-- Zoo Results Grid -->
        <div class="zoo-grid" id="zoo-grid"></div>
    </div>

    <script>
        const zooDatabase = [
            { name: "Tallinn Zoo", address: "Paldiski mnt 145, Tallinn, Estonia", priceUSD: 18, priceEUR: 16.50, hours: "9:00 AM - 7:00 PM", img: "https://unsplash.com", lat: 59.4223, lng: 24.6644 },
            { name: "London Zoo", address: "Regent's Park, London, UK", priceUSD: 40, priceEUR: 37, hours: "10:00 AM - 6:00 PM", img: "https://unsplash.com", lat: 51.5353, lng: -0.1534 },
            { name: "Nagasaki Bio Park", address: "2291-1 Seihicho, Saikai, Japan", priceUSD: 15, priceEUR: 14, hours: "10:00 AM - 5:00 PM", img: "https://unsplash.com", lat: 32.9972, lng: 129.7758 },
            { name: "Zoo Berlin", address: "Hardenbergpl. 8, Berlin, Germany", priceUSD: 22, priceEUR: 20, hours: "9:00 AM - 6:30 PM", img: "https://unsplash.com", lat: 52.5081, lng: 13.3376 },
            { name: "Sydney Zoo", address: "700 Great Western Hwy, Sydney, Australia", priceUSD: 35, priceEUR: 32, hours: "9:00 AM - 5:00 PM", img: "https://unsplash.com", lat: -33.8055, lng: 150.8520 },
            { name: "Toronto Zoo", address: "2000 Meadowvale Rd, Toronto, Canada", priceUSD: 28, priceEUR: 26, hours: "9:30 AM - 4:30 PM", img: "https://unsplash.com", lat: 43.8177, lng: -79.1858 },
            { name: "Faunia", address: "Av. Comunidades, Madrid, Spain", priceUSD: 25, priceEUR: 23, hours: "11:00 AM - 7:00 PM", img: "https://unsplash.com", lat: 40.3934, lng: -3.6146 },
            { name: "Vienna Zoo", address: "Maxingstraße 13b, Wien, Austria", priceUSD: 27, priceEUR: 25, hours: "9:00 AM - 5:30 PM", img: "https://unsplash.com", lat: 48.1824, lng: 16.3028 }
        ];

        let activeZoos = [...zooDatabase];
        // Hardcoded simulation coordinate of user in Kesklinn, Tallinn
        const userLocation = { lat: 59.4370, lng: 24.7536 };

        function renderZoos() {
            const grid = document.getElementById('zoo-grid');
            grid.innerHTML = '';
            
            activeZoos.forEach((zoo, index) => {
                const card = document.createElement('div');
                card.className = 'zoo-card';
                card.onclick = () => toggleDetails(index);
                
                const logistics = calculateLogistics(zoo);

                card.innerHTML = `
                    <div class="zoo-info">
                        <div class="zoo-name">${zoo.name}</div>
                        <div class="zoo-location">${zoo.address}</div>
                        
                        <div class="zoo-teaser-metrics">
                            <span>💵 $${zoo.priceUSD} / €${zoo.priceEUR}</span>
                            <span>⏰ Open</span>
                        </div>

                        <div class="zoo-details" id="details-${index}">
                            <strong>🎫 USD Price:</strong> $${zoo.priceUSD} USD<br>
                            <strong>🎫 EUR Price:</strong> €${zoo.priceEUR} EUR<br>
                            <strong>🕒 Hours:</strong> ${zoo.hours}<br>
                            
                            <img src="${zoo.img}" alt="Capybara at ${zoo.name}" class="capy-photo">
                            
                            <strong>🚪 Available Transportation:</strong>
                            <div class="transport-box">
                                ${logistics}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('zoo-count').innerText = activeZoos.length;
        }

        // Simulates physical distance logic to formulate accurate cost and mode arrays
        function calculateLogistics(zoo) {
            const R = 6371; 
            const dLat = (zoo.lat - userLocation.lat) * Math.PI / 180;
            const dLon = (zoo.lng - userLocation.lng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(userLocation.lat * Math.PI / 180) * Math.cos(zoo.lat * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c; 

            // Scenario 1: Extremely close (Inside Tallinn)
            if (distance < 50) {
                return `
                    🚌 <strong>City Bus:</strong> €2.00 | ~25 mins<br>
                    🚕 <strong>Local Taxi:</strong> €7.00 - €12.00 | ~12 mins<br>
                    🚲 <strong>Bicycle:</strong> Free | ~30 mins
                `;
            } 
            // Scenario 2: Intermediate continent (Europe)
            else if (distance < 3000) {
                return `
                    ✈️ <strong>Flight Strategy:</strong> €40.00 - €150.00 | ~2-3 hrs<br>
                    🚌 <strong>Intercity Coach:</strong> €35.00 - €80.00 | ~22-44 hrs<br>
                    🚗 <strong>Personal Car (Fuel):</strong> €150.00+ | ~18-25 hrs
                `;
            } 
            // Scenario 3: Transoceanic
            else {
                return `
                    ✈️ <strong>Long-Haul Flight:</strong> €400.00 - €900.00 | ~12-24 hrs<br>
                    🛳️ <strong>Ferry & Ocean Cruise:</strong> Not viable for fast travel
                `;
            }
        }

        function toggleDetails(index) {
            const detailPanel = document.getElementById(`details-${index}`);
            const isVisible = detailPanel.style.display === 'block';
            document.querySelectorAll('.zoo-details').forEach(el => el.style.display = 'none');
            detailPanel.style.display = isVisible ? 'none' : 'block';
        }

        function processDisplay() {
            let filtered = [...zooDatabase];

            const priceLimit = document.getElementById('price-filter').value;
            if (priceLimit) {
                filtered = filtered.filter(zoo => zoo.priceUSD <= parseFloat(priceLimit));
            }

            const sortType = document.getElementById('sort-select').value;
            if (sortType === 'cheapest') {
                filtered.sort((a, b) => a.priceUSD - b.priceUSD);
            }

            activeZoos = filtered;
            renderZoos();
        }

        window.onload = renderZoos;
    </script>
</body>
</html>
