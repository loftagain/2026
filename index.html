<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara World Tracker & Router</title>
    
    <!-- Leaflet CSS for styling open-source maps -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        :root {
            --primary: #5c8374;
            --secondary: #1b4242;
            --light: #f5f7f8;
            --dark: #092626;
            --accent: #9ec8b9;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background: linear-gradient(rgba(9, 38, 38, 0.8), rgba(9, 38, 38, 0.8)), url('https://unsplash.com') center/cover;
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Controls Section */
        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            text-transform: uppercase;
        }
        select, input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 180px;
        }

        /* Map UI */
        .map-section {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        #map {
            height: 350px;
            width: 100%;
            border-radius: 8px;
            background: #eee;
        }
        #route-info {
            margin-top: 1rem;
            display: none;
        }
        .route-card {
            background: var(--light);
            padding: 1rem;
            border-left: 4px solid var(--primary);
            margin-bottom: 0.5rem;
            border-radius: 0 6px 6px 0;
        }

        /* Zoo Cards Grid */
        .zoo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 1.5rem;
        }
        .zoo-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .zoo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .zoo-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .zoo-name {
            font-size: 1.3rem;
            color: var(--secondary);
            margin-bottom: 0.25rem;
            font-weight: bold;
        }
        .zoo-location {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 1rem;
        }
        .zoo-teaser-metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }
        .zoo-details {
            display: none;
            background: #fafafa;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #444;
            line-height: 1.5;
        }
        .zoo-details strong { color: var(--secondary); }
        .btn-travel {
            margin-top: auto;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-travel:hover { background: var(--secondary); }
    </style>
</head>
<body>

    <header>
        <h1>Global Capybara Tracker</h1>
        <p>Locate the world's most friendly giant rodents on open-source maps.</p>
    </header>

    <div class="container">
        <!-- Filtering and Sorting Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="sort-select">Sort Zoos By</label>
                <select id="sort-select" onchange="processDisplay()">
                    <option value="default">Default List</option>
                    <option value="cheapest">Cheapest Ticket First</option>
                    <option value="closest">Closest to My Location</option>
                </select>
            </div>
            <div class="control-group">
                <label for="price-filter">Max Ticket Price (USD)</label>
                <input type="number" id="price-filter" placeholder="e.g. 30" oninput="processDisplay()">
            </div>
            <div style="flex-grow: 1; text-align: right; font-size: 0.9rem; color: #666;">
                <span id="zoo-count"></span> locations discovered.
            </div>
        </div>

        <!-- Map and Routing Results -->
        <section class="map-section">
            <h2>Expedition Routing Map</h2>
            <p style="color: #666; margin-bottom: 1rem;">Click "Plan Travel" on any card below to see straight-line distances mapped.</p>
            <div id="map"></div>
            <div id="route-info"></div>
        </section>

        <!-- Zoo Results -->
        <div class="zoo-grid" id="zoo-grid"></div>
    </div>

    <!-- Leaflet JS library for OpenStreetMap display -->
    <script src="https://unpkg.com"></script>

    <script>
        const zooDatabase = [
            { name: "San Diego Zoo", address: "2920 Zoo Dr, San Diego, CA 92101, USA", price: 72, hours: "9:00 AM - 5:00 PM", lat: 32.7353, lng: -117.1490 },
            { name: "London Zoo", address: "Regent's Park, London NW1 4RY, UK", price: 40, hours: "10:00 AM - 6:00 PM", lat: 51.5353, lng: -0.1534 },
            { name: "Nagasaki Bio Park", address: "2291-1 Seihicho Nakayamago, Saikai, Japan", price: 15, hours: "10:00 AM - 5:00 PM", lat: 32.9972, lng: 129.7758 },
            { name: "Zoo Berlin", address: "Hardenbergpl. 8, 10787 Berlin, Germany", price: 22, hours: "9:00 AM - 6:30 PM", lat: 52.5081, lng: 13.3376 },
            { name: "Sydney Zoo", address: "700 Great Western Hwy, Sydney, Australia", price: 35, hours: "9:00 AM - 5:00 PM", lat: -33.8055, lng: 150.8520 },
            { name: "Toronto Zoo", address: "2000 Meadowvale Rd, Toronto, ON, Canada", price: 28, hours: "9:30 AM - 4:30 PM", lat: 43.8177, lng: -79.1858 },
            { name: "Faunia", address: "Av. Comunidades, 28032 Madrid, Spain", price: 25, hours: "11:00 AM - 7:00 PM", lat: 40.3934, lng: -3.6146 },
            { name: "Vienna Zoo", address: "Maxingstraße 13b, 1130 Wien, Austria", price: 27, hours: "9:00 AM - 5:30 PM", lat: 48.1824, lng: 16.3028 }
        ];

        let map;
        let userLocation = null;
        let activeZoos = [...zooDatabase];
        let currentRouteLine = null;

        // Initialize Map
        function initApp() {
            // Leaflet map initialization targeting the 'map' div
            map = L.map('map').setView([20.0, 0.0], 2);

            // Loading OpenStreetMap free tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Add zoo markers to the map
            zooDatabase.forEach(zoo => {
                L.marker([zoo.lat, zoo.lng]).addTo(map)
                    .bindPopup(`<b>${zoo.name}</b><br>Tickets: $${zoo.price}`);
            });

            // Handle Geolocation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        map.setView([userLocation.lat, userLocation.lng], 4);
                        
                        L.circleMarker([userLocation.lat, userLocation.lng], {
                            radius: 8,
                            color: '#0074D9',
                            fillColor: '#0074D9',
                            fillOpacity: 0.8
                        }).addTo(map).bindPopup("Your Current Location").openPopup();

                        processDisplay();
                    },
                    () => { console.log("Geolocation blocked by user."); }
                );
            }

            processDisplay();
        }

        function renderZoos() {
            const grid = document.getElementById('zoo-grid');
            grid.innerHTML = '';
            
            activeZoos.forEach((zoo, index) => {
                const card = document.createElement('div');
                card.className = 'zoo-card';
                card.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        toggleDetails(index);
                    }
                };
                
                card.innerHTML = `
                    <div class="zoo-info">
                        <div class="zoo-name">${zoo.name}</div>
                        <div class="zoo-location">${zoo.address}</div>
                        
                        <div class="zoo-teaser-metrics">
                            <span>💵 Est. $${zoo.price}</span>
                            <span>⏰ Open Today</span>
                        </div>

                        <div class="zoo-details" id="details-${index}">
                            <strong>🎫 Ticket Price:</strong> $${zoo.price} USD approx.<br>
                            <strong>🕒 Regular Hours:</strong> ${zoo.hours}<br>
                            <strong>🌿 Resident Animal:</strong> Capybara<br>
                            <strong>📍 Coordinates:</strong> ${zoo.lat.toFixed(2)}, ${zoo.lng.toFixed(2)}
                        </div>

                        <button class="btn-travel" onclick="drawTravelPath(${zoo.lat}, ${zoo.lng}, '${zoo.name}', event)">Plan Travel</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('zoo-count').innerText = activeZoos.length;
        }

        function toggleDetails(index) {
            const detailPanel = document.getElementById(`details-${index}`);
            const isVisible = detailPanel.style.display === 'block';
            document.querySelectorAll('.zoo-details').forEach(el => el.style.display = 'none');
            detailPanel.style.display = isVisible ? 'none' : 'block';
        }

        function processDisplay() {
            let filtered = [...zooDatabase];

            const priceLimit = document.getElementById('price-filter').value;
            if (priceLimit) {
                filtered = filtered.filter(zoo => zoo.price <= parseFloat(priceLimit));
            }

            const sortType = document.getElementById('sort-select').value;
            
            if (sortType === 'cheapest') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortType === 'closest') {
                if (!userLocation) {
                    alert("Please allow location tracking to sort by proximity.");
                    document.getElementById('sort-select').value = 'default';
                } else {
                    filtered.sort((a, b) => {
                        const distA = getHaversineDistance(userLocation.lat, userLocation.lng, a.lat, a.lng);
                        const distB = getHaversineDistance(userLocation.lat, userLocation.lng, b.lat, b.lng);
                        return distA - distB;
                    });
                }
            }

            activeZoos = filtered;
            renderZoos();
        }

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in KM
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        // Draw a path from user to the chosen zoo on the map
        function drawTravelPath(zooLat, zooLng, zooName, event) {
            event.stopPropagation();
            
            if (!userLocation) {
                alert("We need your location allowed to map the physical expedition line.");
                return;
            }

            // Remove any previous line drawn on the map
            if (currentRouteLine) {
                map.removeLayer(currentRouteLine);
            }

            const routeInfoDiv = document.getElementById('route-info');
            routeInfoDiv.style.display = 'block';

            // Draw straight line "Great Circle" path on the Leaflet Map
            const pathCoordinates = [
                [userLocation.lat, userLocation.lng],
                [zooLat, zooLng]
            ];

            currentRouteLine = L.polyline(pathCoordinates, {color: '#FF4136', weight: 4}).addTo(map);
            
            // Adjust map view to fit both the user and the target zoo
            map.fitBounds(currentRouteLine.getBounds(), { padding: [50, 50] });

            const distance = getHaversineDistance(userLocation.lat, userLocation.lng, zooLat, zooLng);

            routeInfoDiv.innerHTML = `
                <div class="route-card">
                    <strong>🌐 Global Expedition to ${zooName}</strong><br>
                    Direct Aerial Distance: ~${Math.round(distance).toLocaleString()} KM<br>
                    <small>Note: Turn-by-turn road physics are omitted on the free open-source map to avoid private API blockages on GitHub.</small>
                </div>
            `;
        }

        // Fire the code when scripts load
        window.onload = initApp;
    </script>
</body>
</html>
