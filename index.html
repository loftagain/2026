<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Tracker</title>
    <style>
        :root{--primary:#5c8374;--secondary:#1b4242;--light:#f5f7f8;--dark:#092626}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
        body{background:var(--light);color:var(--dark);height:100%}
        header{background:linear-gradient(rgba(9,38,38,0.8),rgba(9,38,38,0.8)),url('https://unsplash.com') center/cover;color:#fff;text-align:center;padding:2rem 1rem}
        .container{max-width:1200px;margin:1.5rem auto;padding:0 1rem}
        .controls{background:#fff;padding:1rem;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.05);margin-bottom:1.5rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
        .control-group{flex:1 1 200px;display:flex;flex-direction:column;gap:0.25rem}
        label{font-size:0.75rem;font-weight:700;color:var(--secondary);text-transform:uppercase}
        select,input{padding:0.6rem;border:1px solid #ccc;border-radius:6px;font-size:0.9rem}
        .results-count{font-size:0.85rem;color:#666;flex:1 1 100%;text-align:center}
        .zoo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1rem}
        .zoo-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;flex-direction:column;cursor:pointer;transition:0.2s;border:1px solid #eee}
        .zoo-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.1)}
        .zoo-info{padding:1rem;display:flex;flex-direction:column;flex-grow:1}
        .zoo-name{font-size:1.05rem;color:var(--secondary);margin-bottom:0.25rem;font-weight:700}
        .zoo-location{font-size:0.8rem;color:#666;margin-bottom:0.75rem}
        .zoo-teaser-metrics{display:flex;justify-content:space-between;font-size:0.8rem;color:#555;padding-top:0.5rem;border-top:1px solid #eee;margin-top:auto}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center;padding:1rem}
        .modal-content{background:#fff;width:100%;max-width:450px;padding:1.5rem;border-radius:12px;position:relative;animation:mIn 0.3s ease;max-height:90vh;overflow-y:auto}
        @keyframes mIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
        .modal-close{position:absolute;top:10px;right:15px;font-size:1.5rem;color:#999;cursor:pointer;border:none;background:none}
        .modal-header{font-size:1.3rem;color:var(--secondary);font-weight:700;margin-bottom:0.25rem}
        .modal-address{font-size:0.8rem;color:#666;margin-bottom:1rem}
        .modal-body p{font-size:0.9rem;color:#444;margin-bottom:0.4rem}
        .modal-body strong{color:var(--secondary)}
        .zoo-link{display:inline-block;margin:0.5rem 0;color:var(--primary);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--primary)}
        .transport-box{background:var(--light);padding:0.6rem;border-radius:6px;border:1px solid #e0e0e0;margin-top:0.5rem;font-size:0.85rem;line-height:1.4}
        @media(max-width:1024px){.zoo-grid{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:768px){.zoo-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:480px){.zoo-grid{grid-template-columns:1fr}.modal-content{border-radius:0;height:100%;max-height:100vh;max-width:100vw}}
    </style>
</head>
<body>
    <header>
        <h1>Global Capybara Tracker</h1>
        <p>Browse global locations, logistics, and petting setups.</p>
    </header>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="sort">Sort By</label>
                <select id="sort" onchange="process()"><option value="def">Default</option><option value="cheap">Cheapest First</option></select>
            </div>
            <div class="control-group">
                <label for="petting">Petting</label>
                <select id="petting" onchange="process()"><option value="all">All</option><option value="yes">Yes</option><option value="no">No</option></select>
            </div>
            <div class="control-group">
                <label for="price">Max USD Price</label>
                <input type="number" id="price" placeholder="e.g. 30" oninput="process()">
            </div>
            <div class="results-count"><span id="count"></span> locations found.</div>
        </div>
        <div class="zoo-grid" id="grid"></div>
    </div>
    <div class="modal-overlay" id="ov" onclick="cM()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="cM()">×</button>
            <div class="modal-header" id="mH"></div>
            <div class="modal-address" id="mA"></div>
            <div class="modal-body">
                <p><strong>USD:</strong> <span id="mUsd"></span> | <strong>EUR:</strong> <span id="mEur"></span></p>
                <p><strong>Hours:</strong> <span id="mHrs"></span></p>
                <p><strong>Petting:</strong> <span id="mP"></span></p>
                <a href="#" id="mL" class="zoo-link" target="_blank">Visit Website ↗</a>
                <p><strong>Logistics:</strong></p>
                <div class="transport-box" id="mT"></div>
            </div>
        </div>
    </div>
    <script>
        const db = [
            {n:"San Francisco Zoo",a:"CA, USA",pU:30,pE:27.5,h:"10AM-5PM",u:"https://sfzoo.org",pt:0,lt:37.7,lg:-122.5},
            {n:"Sacramento Zoo",a:"CA, USA",pU:23,pE:21,h:"9AM-4PM",u:"https://saczoo.org",pt:0,lt:38.5,lg:-121.5},
            {n:"Happy Hollow Zoo",a:"CA, USA",pU:18,pE:16.5,h:"10AM-5PM",u:"https://happyhollow.org",pt:0,lt:37.3,lg:-121.8},

            {n:"Brevard Zoo",a:"FL, USA",pU:32,pE:29,h:"9:30AM-5PM",u:"https://brevardzoo.org",pt:0,lt:28.2,lg:-80.7},
            {n:"Brookfield Zoo",a:"IL, USA",pU:30,pE:27.5,h:"10AM-5PM",u:"https://brookfieldzoo.org",pt:0,lt:41.8,lg:-87.8},

            {n:"Tanganyika Park",a:"KS, USA",pU:40,pE:37,h:"9AM-5PM",u:"https://twpark.com",pt:1,lt:37.7,lg:-97.5},
            {n:"Lewis Farm Zoo",a:"MI, USA",pU:18,pE:16.5,h:"10AM-6PM",u:"https://lewisfarms.com",pt:1,lt:43.6,lg:-86.3},

            {n:"Majestic Meadows",a:"OH, USA",pU:15,pE:14,h:"10AM-5PM",u:"https://majesticmeadowsalpacas.com",pt:1,lt:41.1,lg:-81.9},
            {n:"Snake Farm Zoo",a:"TX, USA",pU:22,pE:20,h:"10AM-6PM",u:"https://awsfzoo.com",pt:1,lt:29.7,lg:-98.1},
            {n:"Hertfordshire Zoo",a:"England, UK",pU:25,pE:23,h:"10AM-5PM",u:"https://hertfordshirezoo.com",pt:1,lt:51.7,lg:-0.1},
            {n:"Chew Valley Park",a:"England, UK",pU:15,pE:14,h:"10AM-4PM",u:"https://chewvalleyanimalpark.co.uk",pt:1,lt:51.4,lg:-2.6},
            {n:"Hoo Zoo",a:"England, UK",pU:18,pE:16.5,h:"10AM-5PM",u:"https://hoozoo.com",pt:1,lt:52.7,lg:-2.5},
            {n:"Capyba Cafe",a:"Tokyo, Japan",pU:12,pE:11,h:"11AM-7PM",u:"https://capybacafe.jp",pt:1,lt:35.7,lg:139.7},
            {n:"San Diego Zoo",a:"CA, USA",pU:72,pE:66,h:"9AM-5PM",u:"https://sandiegozoo.org",pt:1,lt:32.7,lg:-117.1},
            {n:"London Zoo",a:"London, UK",pU:40,pE:37,h:"10AM-6PM",u:"https://londonzoo.org",pt:1,lt:51.5,lg:-0.2},
            {n:"Saaremaa Zoo",a:"Estonia",pU:12,pE:11,h:"10AM-6PM",u:"https://saaremaazoo.ee",pt:1,lt:58.2,lg:22.5},
            {n:"Nagasaki Bio Park",a:"Japan",pU:15,pE:14,h:"10AM-5PM",u:"http://biopark.co.jp",pt:1,lt:33.0,lg:129.8},
            {n:"Izu Shaboten Zoo",a:"Japan",pU:19,pE:17.5,h:"9AM-5PM",u:"https://izushaboten.com",pt:1,lt:34.9,lg:139.1}
        ];
        let current = [...db];
        const uLoc = {lt:59.437,lg:24.754}; // Tallinn base
        function ren(){
            const g = document.getElementById('grid');g.innerHTML='';
            current.forEach((z)=>{
                const d=document.createElement('div');d.className='zoo-card';d.onclick=()=>oM(z);
                d.innerHTML=`<div class="zoo-info"><div class="zoo-name">${z.n}</div><div class="zoo-location">${z.a}</div><div class="zoo-teaser-metrics"><span>💵 $${z.pU} / €${z.pE}</span><span>🤝 Pet: ${z.pt?'Yes':'No'}</span></div></div>`;
                g.appendChild(d);
            });
            document.getElementById('count').innerText=current.length;
        }
        function oM(z){
            document.getElementById('mH').innerText=z.n;document.getElementById('mA').innerText=z.a;
            document.getElementById('mUsd').innerText=`$${z.pU}`;document.getElementById('mEur').innerText=`€${z.pE}`;
            document.getElementById('mHrs').innerText=z.h;document.getElementById('mP').innerText=z.pt?'Yes':'No';
            const l=document.getElementById('mL');l.href=z.u;document.getElementById('mT').innerHTML=log(z);
            document.getElementById('ov').style.display='flex';
        }
        function cM(){document.getElementById('ov').style.display='none'}
        function log(z){
            const d=6371*2*Math.atan2(Math.sqrt(Math.sin((z.lt-uLoc.lt)*Math.PI/360)**2+Math.cos(uLoc.lt*Math.PI/180)*Math.cos(z.lt*Math.PI/180)*Math.sin((z.lg-uLoc.lg)*Math.PI/360)**2),Math.sqrt(1-(Math.sin((z.lt-uLoc.lt)*Math.PI/360)**2+Math.cos(uLoc.lt*Math.PI/180)*Math.cos(z.lt*Math.PI/180)*Math.sin((z.lg-uLoc.lg)*Math.PI/360)**2)));
            if(d<300)return `🚗 Car/Ferry: €20-€35 | ~4 hrs<br>🚌 Intercity: €12-€18 | ~4.5 hrs`;
            if(d<3000)return `✈️ Flight: €40-€150 | ~2-3 hrs<br>🚌 Intercity: €35-€80 | ~22-44 hrs`;
            return `✈️ Long Flight: €400-€900 | ~12-24 hrs<br>🛳️ Sea: Not viable for fast travel`;
        }
        function process(){
            let f=[...db];
            const p=document.getElementById('price').value;if(p)f=f.filter(z=>z.pU<=parseFloat(p));
            const t=document.getElementById('petting').value;if(t!=='all')f=f.filter(z=>z.pt===(t==='yes'));
            if(document.getElementById('sort').value==='cheap')f.sort((a,b)=>a.pU-b.pU);
            current=f;ren();
        }
        window.onload=ren;window.addEventListener('keydown',(e)=>{if(e.key==='Escape')cM()});
    </script>
</body>
</html>
