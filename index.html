<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara World Tracker</title>

    <style>
              :root {
            --primary: #5c8374;
            --secondary: #1b4242;
            --light: #f5f7f8;
            --dark: #092626;
            --accent: #9ec8b9;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        html, body {
            background-color: var(--light);
            color: var(--dark);
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        
        header {
            background: linear-gradient(rgba(9, 38, 38, 0.8), rgba(9, 38, 38, 0.8)), url('https://unsplash.com') center/cover;
            color: white;
            text-align: center;
            padding: clamp(2rem, 5vw, 3.5rem) 1rem;
        }
        header h1 { 
            font-size: clamp(1.8rem, 4vw, 2.5rem); 
            margin-bottom: 0.5rem; 
        }
        header p {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            margin: clamp(1rem, 3vw, 2rem) auto;
            padding: 0 1rem;
        }

        .controls {
            background: white;
            padding: 1.25rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1 1 200px;
        }
        label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        select, input {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            background-color: #fff;
            -webkit-appearance: none;
        }
        .results-count {
            font-size: 0.9rem; 
            color: #666;
            flex: 1 1 100%;
            text-align: center;
        }

        .zoo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
            margin-top: 1.5rem;
        }
        
        .zoo-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
        }
        
        @media (hover: hover) {
            .zoo-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 20px rgba(0,0,0,0.1);
                border-color: var(--accent);
            }
        }
        
        .zoo-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .zoo-name {
            font-size: 1.15rem;
            color: var(--secondary);
            margin-bottom: 0.25rem;
            font-weight: bold;
        }
        .zoo-location {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        .zoo-teaser-metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #555;
            padding-top: 0.75rem;
            border-top: 1px solid #eee;
            margin-top: auto;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            border: none;
            background: none;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { color: var(--dark); }
        
        .modal-header {
            font-size: clamp(1.3rem, 3vw, 1.5rem);
            color: var(--secondary);
            font-weight: bold;
            margin-bottom: 0.25rem;
            padding-right: 20px;
        }
        .modal-address {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1.25rem;
        }
        .modal-body p {
            font-size: 0.95rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        .modal-body strong { color: var(--secondary); }
        
        .zoo-link {
            display: inline-block;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
            border-bottom: 1px dashed var(--primary);
            font-size: 0.95rem;
        }
        .zoo-link:hover {
            color: var(--secondary);
            border-bottom-style: solid;
        }

        .transport-box {
            background: var(--light);
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .container { padding: 0 0.75rem; }
            .controls { padding: 1rem; gap: 1rem; }
            .modal-overlay { padding: 0; }
            .modal-content {
                border-radius: 0;
                height: 100%;
                max-height: 100vh;
                max-width: 100vw;
                padding: 1.5rem;
            }
            .modal-close { top: 10px; right: 10px; }
        }

    </style>
</head>

    <header>
        <h1>Global Capybara Tracker</h1>
        <p>Analyze transit corridors and admission grids without map rendering.</p>
    </header>

    <div class="container">
        <!-- Filtering and Sorting Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="sort-select">Sort Zoos By</label>
                <select id="sort-select" onchange="processDisplay()">
                    <option value="default">Default List</option>
                    <option value="cheapest">Cheapest Ticket First</option>
                </select>
            </div>
            <div class="control-group">
                <label for="petting-filter">Capybara Petting</label>
                <select id="petting-filter" onchange="processDisplay()">
                    <option value="all">All Zoos</option>
                    <option value="yes">Petting Offered Only</option>
                    <option value="no">No Petting Only</option>
                </select>
            </div>
            <div class="control-group">
                <label for="price-filter">Max Ticket Price (USD)</label>
                <input type="number" id="price-filter" placeholder="e.g. 30" oninput="processDisplay()">
            </div>
            <div class="results-count">
                <span id="zoo-count"></span> locations discovered.
            </div>
        </div>

        <!-- Zoo Results Grid -->
        <div class="zoo-grid" id="zoo-grid"></div>
    </div>

    <!-- CENTRAL POPUP MODAL -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" aria-label="Close" onclick="closeModal(event)">×</button>
            <div class="modal-header" id="modal-title"></div>
            <div class="modal-address" id="modal-address"></div>
            <div class="modal-body">
                <p><strong>🎫 USD Price:</strong> <span id="modal-price-usd"></span></p>
                <p><strong>🎫 EUR Price:</strong> <span id="modal-price-eur"></span></p>
                <p><strong>🕒 Hours:</strong> <span id="modal-hours"></span></p>
                <p><strong>🤝 Direct Petting:</strong> <span id="modal-petting"></span></p>
                
                <a href="#" id="modal-link" class="zoo-link" target="_blank" rel="noopener noreferrer">Visit Official Website ↗</a>
                
                <p><strong>🚪 Available Transportation Strategy:</strong></p>
                <div class="transport-box" id="modal-transport"></div>
            </div>
        </div>
    </div>
