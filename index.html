<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara World Tracker</title>
    <style>
        :root {
            --primary: #5c8374;
            --secondary: #1b4242;
            --light: #f5f7f8;
            --dark: #092626;
            --accent: #9ec8b9;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background: linear-gradient(rgba(9, 38, 38, 0.8), rgba(9, 38, 38, 0.8)), url('https://unsplash.com') center/cover;
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Controls Section */
        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            text-transform: uppercase;
        }
        select, input {
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 180px;
        }

        /* Zoo Cards Grid: Explicitly forced to 4 columns on desktop */
        .zoo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        /* Box styling */
        .zoo-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
        }
        .zoo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }
        .zoo-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .zoo-name {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 0.25rem;
            font-weight: bold;
        }
        .zoo-location {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }
        .zoo-teaser-metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #555;
            padding-top: 0.5rem;
            border-top: 1px solid #eee;
        }
        
        /* Expandable Details */
        .zoo-details {
            display: none;
            background: #fafafa;
            padding: 0.75rem;
            border-radius: 6px;
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: #444;
            line-height: 1.4;
        }
        .zoo-details strong { color: var(--secondary); }

        /* Responsive Breakpoints: Scales down smoothly on smaller devices */
        @media (max-width: 1024px) {
            .zoo-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .zoo-grid { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 480px) {
            .zoo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Global Capybara Tracker</h1>
        <p>A compiled list of global wildlife establishments that host Capybaras.</p>
    </header>

    <div class="container">
        <!-- Filtering and Sorting Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="sort-select">Sort Zoos By</label>
                <select id="sort-select" onchange="processDisplay()">
                    <option value="default">Default List</option>
                    <option value="cheapest">Cheapest Ticket First</option>
                </select>
            </div>
            <div class="control-group">
                <label for="price-filter">Max Ticket Price (USD)</label>
                <input type="number" id="price-filter" placeholder="e.g. 30" oninput="processDisplay()">
            </div>
            <div style="flex-grow: 1; text-align: right; font-size: 0.9rem; color: #666;">
                <span id="zoo-count"></span> locations discovered.
            </div>
        </div>

        <!-- Zoo Results Grid -->
        <div class="zoo-grid" id="zoo-grid"></div>
    </div>

    <script>
        const zooDatabase = [
            { name: "San Diego Zoo", address: "2920 Zoo Dr, San Diego, CA, USA", price: 72, hours: "9:00 AM - 5:00 PM" },
            { name: "London Zoo", address: "Regent's Park, London, UK", price: 40, hours: "10:00 AM - 6:00 PM" },
            { name: "Nagasaki Bio Park", address: "2291-1 Seihicho, Saikai, Japan", price: 15, hours: "10:00 AM - 5:00 PM" },
            { name: "Zoo Berlin", address: "Hardenbergpl. 8, Berlin, Germany", price: 22, hours: "9:00 AM - 6:30 PM" },
            { name: "Sydney Zoo", address: "700 Great Western Hwy, Sydney, Australia", price: 35, hours: "9:00 AM - 5:00 PM" },
            { name: "Toronto Zoo", address: "2000 Meadowvale Rd, Toronto, Canada", price: 28, hours: "9:30 AM - 4:30 PM" },
            { name: "Faunia", address: "Av. Comunidades, Madrid, Spain", price: 25, hours: "11:00 AM - 7:00 PM" },
            { name: "Vienna Zoo", address: "Maxingstraße 13b, Wien, Austria", price: 27, hours: "9:00 AM - 5:30 PM" }
        ];

        let activeZoos = [...zooDatabase];

        function renderZoos() {
            const grid = document.getElementById('zoo-grid');
            grid.innerHTML = '';
            
            activeZoos.forEach((zoo, index) => {
                const card = document.createElement('div');
                card.className = 'zoo-card';
                card.onclick = () => toggleDetails(index);
                
                card.innerHTML = `
                    <div class="zoo-info">
                        <div class="zoo-name">${zoo.name}</div>
                        <div class="zoo-location">${zoo.address}</div>
                        
                        <div class="zoo-teaser-metrics">
                            <span>💵 $${zoo.price}</span>
                            <span>⏰ Open</span>
                        </div>

                        <div class="zoo-details" id="details-${index}">
                            <strong>🎫 Ticket Price:</strong> $${zoo.price} USD<br>
                            <strong>🕒 Regular Hours:</strong> ${zoo.hours}<br>
                            <strong>🌿 Species:</strong> Hydrochoerus hydrochaeris
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('zoo-count').innerText = activeZoos.length;
        }

        // Toggles expansion of cards to view hours and tickets
        function toggleDetails(index) {
            const detailPanel = document.getElementById(`details-${index}`);
            const isVisible = detailPanel.style.display === 'block';
            document.querySelectorAll('.zoo-details').forEach(el => el.style.display = 'none');
            detailPanel.style.display = isVisible ? 'none' : 'block';
        }

        function processDisplay() {
            let filtered = [...zooDatabase];

            const priceLimit = document.getElementById('price-filter').value;
            if (priceLimit) {
                filtered = filtered.filter(zoo => zoo.price <= parseFloat(priceLimit));
            }

            const sortType = document.getElementById('sort-select').value;
            if (sortType === 'cheapest') {
                filtered.sort((a, b) => a.price - b.price);
            }

            activeZoos = filtered;
            renderZoos();
        }

        // Run execution on page ready
        window.onload = renderZoos;
    </script>
</body>
</html>
